# PR / main CI — typecheck + the endpoint-id lock + tests. Publishing is a TAG
# (publish-catalog.yml); this workflow never touches releases or AWS.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      # Identity guard (design D46): endpoint ids are public API, so a
      # compiled id missing from connectors/ids.lock.json, or a locked id
      # missing from the bundle, fails here. New endpoints commit the lock
      # with `deno task ids:check --update`.
      - run: deno task ids:check
      - run: deno task test
